groups:
  - name: ecommerce-alerts
    rules:
      - alert: EcommerceHighErrorRate
        expr: |
          (
            sum(rate(ecommerce_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(ecommerce_http_requests_total[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "E-commerce error rate is high"
          description: "More than 5% of requests are returning 5xx responses."

      - alert: EcommerceHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(ecommerce_http_request_duration_seconds_bucket[5m]))
            by (le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "E-commerce latency is high"
          description: "95th percentile latency is above 500ms."
